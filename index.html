<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Bluey · Cardiac Rhythm Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#E9F2F8; --panel:#FFFFFF; --navy:#17324A; --slate:#5B7288;
    --blue:#2F7FD1; --blue-dark:#215E9E; --blue-soft:#D9EAF8;
    --paper:#FFF9F6; --green:#2C9C6A; --green-soft:#DFF3E9;
    --red:#D95757; --red-soft:#FBE4E4;
    --disp:'Fredoka','Quicksand',ui-rounded,system-ui,sans-serif;
    --body:'Nunito','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);font-family:var(--body);color:var(--navy);padding:16px 12px 40px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-family:var(--disp);font-size:40px;margin:8px 0 2px;letter-spacing:-.5px}
  .accent{color:var(--blue)}
  .sub{color:var(--slate);font-size:16px;font-weight:700;margin:0 0 18px}
  .card{background:var(--panel);border-radius:16px;padding:18px 20px;text-align:left;box-shadow:0 2px 10px #17324A14}
  .panel{background:var(--panel);border-radius:16px;padding:12px;box-shadow:0 2px 10px #17324A14}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:11px 20px;font-family:var(--disp);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--blue-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.big{font-size:18px;padding:13px 34px;margin-top:12px}
  .ghost{background:transparent;color:var(--blue-dark);border:2px solid #2F7FD155;border-radius:12px;padding:9px 16px;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}
  .choice{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid #C9D8E4;border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--body);font-size:15.5px;font-weight:700;color:var(--navy)}
  .choice small{display:block;font-weight:500;font-size:13px;color:var(--slate)}
  .choice:hover{border-color:var(--blue)}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .stepchips{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:#D3E2ED;color:var(--slate)}
  .chip.now{background:var(--blue);color:#fff}
  .chip.done{background:var(--green);color:#fff}
  .speech{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
  .bubble{background:var(--blue-soft);border:2px solid #2F7FD122;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:15px;line-height:1.45}
  .fb{border-radius:12px;padding:12px 14px;margin-top:10px;border:2px solid}
  .fb.ok{background:var(--green-soft);border-color:var(--green)}
  .fb.bad{background:var(--red-soft);border-color:var(--red)}
  .fb .verdict{font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:4px}
  .fb.ok .verdict{color:var(--green)} .fb.bad .verdict{color:var(--red)}
  .fb p{margin:0;font-size:14.5px;line-height:1.45}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .brand{font-family:var(--disp);font-weight:700;font-size:20px}
  .brand .pt{color:var(--slate);font-size:14px;font-weight:600}
  .score{background:var(--panel);border-radius:10px;padding:5px 12px;font-weight:800;color:var(--blue-dark);box-shadow:0 1px 5px #17324A12}
  .stats{display:flex;gap:10px;justify-content:center;margin:18px 0}
  .stat{background:var(--panel);border-radius:14px;padding:12px 18px;min-width:92px;box-shadow:0 2px 8px #17324A12}
  .stat b{display:block;font-family:var(--disp);font-size:24px;color:var(--blue)}
  .stat span{font-size:12.5px;color:var(--slate);font-weight:700}
  .steplist{display:flex;gap:10px;align-items:baseline;margin-bottom:7px}
  .num{background:var(--blue);color:#fff;border-radius:8px;font-weight:800;font-size:13px;padding:2px 8px;font-family:var(--disp)}
  .fine{color:var(--slate);font-size:13px;margin:12px 0 0}
  .rate-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .count{font-weight:800;margin-bottom:4px}
  .count b{color:var(--blue);font-family:var(--disp);font-size:20px}
  .zoomwrap{overflow-x:auto;border-radius:12px;margin-top:10px}
  .calrow{display:flex;justify-content:flex-start;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .calread{font-size:13px;font-weight:800;color:var(--blue-dark);background:var(--blue-soft);border-radius:8px;padding:4px 10px}
  .findings{background:#F4F8FB;border:2px solid #C9D8E4;border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .findings .ftitle{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--blue-dark);margin-bottom:6px}
  .frow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
  .frow span{color:var(--slate);font-weight:700}
  .frow b{color:var(--navy);text-align:right}
  svg.strip{width:100%;display:block;border-radius:12px;background:var(--paper);touch-action:manipulation}
  .cb-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:cbdraw 1.1s ease-out forwards}
  @keyframes cbdraw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.cb-draw{animation:none;stroke-dashoffset:0}}
  .center{text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ============ Code Bluey - standalone build (mirrors the artifact version) ============ */

/* ---------- constants ---------- */
var PX_PER_SMALL = 5, PX_PER_SEC = PX_PER_SMALL / 0.04, STRIP_SEC = 6;
var STRIP_W = STRIP_SEC * PX_PER_SEC, STRIP_H = 150, BASE_Y = 92, MV = 50;

/* ---------- waveform math ---------- */
function interp(cp, t){
  if (t <= cp[0][0] || t >= cp[cp.length-1][0]) return 0;
  for (var i=1;i<cp.length;i++){
    if (t <= cp[i][0]){
      var t0=cp[i-1][0], y0=cp[i-1][1], t1=cp[i][0], y1=cp[i][1];
      return y0 + ((t-t0)/(t1-t0))*(y1-y0);
    }
  }
  return 0;
}
function narrowBeat(pr, pAmp){
  var qs = pr;
  return {
    cp: [[0,0],[0.04,pAmp],[0.08,0],[qs-0.005,0],[qs+0.012,-0.11],[qs+0.036,1.12],
         [qs+0.06,-0.26],[qs+0.08,0.02],[qs+0.11,0.03],[qs+0.15,0.07],[qs+0.2,0.3],
         [qs+0.24,0.18],[qs+0.3,0]],
    rOffset: qs+0.036, len: qs+0.3, qrsSec: 0.08
  };
}
function wideBeat(){
  return {
    cp: [[0,0],[0.02,0.18],[0.06,1.05],[0.1,0.15],[0.15,-0.85],[0.22,-0.35],[0.28,0.3],[0.34,0]],
    rOffset: 0.06, len: 0.34, qrsSec: 0.16
  };
}
function rand(min,max){ return min + Math.random()*(max-min); }

function generateStrip(key){
  var dt = 1/150, n = Math.round(STRIP_SEC/dt)+1;
  var samples = new Float32Array(n), peaks = [], beatStarts = [];
  var beat = null, prSec = null, baseline = null;

  if (key === "asystole"){
    var ph = rand(0,6);
    for (var i=0;i<n;i++){
      var t = i*dt;
      samples[i] = 0.05*Math.sin(2*Math.PI*0.22*t+ph) + 0.012*Math.sin(11*t);
    }
    return {samples:samples, dt:dt, peaks:[], prSec:null, qrsSec:null, firstBeat:null};
  }
  if (key === "vtach"){
    beat = wideBeat();
    var rr = 60/rand(150,175);
    for (var b=0.12;b<STRIP_SEC;b+=rr) beatStarts.push(b);
  } else if (key === "afib"){
    prSec = null; /* no P waves, no measurable PR */
    beat = narrowBeat(0.14, 0); /* template offset only; no P drawn */
    var p1 = rand(0,6), p2 = rand(0,6);
    baseline = function(t){
      return 0.045*Math.sin(2*Math.PI*7.3*t+p1) + 0.035*Math.sin(2*Math.PI*5.1*t+p2);
    };
    var bb = 0.1;
    while (bb < STRIP_SEC){ beatStarts.push(bb); bb += rand(0.48,0.92); }
  } else {
    var rateRange, pr;
    if (key==="nsr"){ rateRange=[64,92]; pr=0.16; }
    else if (key==="brady"){ rateRange=[40,55]; pr=0.17; }
    else if (key==="tach"){ rateRange=[105,122]; pr=0.14; }
    else { rateRange=[58,82]; pr=0.28; }
    prSec = pr;
    beat = narrowBeat(pr, 0.13);
    var rr2 = 60/rand(rateRange[0], rateRange[1]);
    for (var b2=0.1;b2<STRIP_SEC;b2+=rr2) beatStarts.push(b2);
  }
  for (var j=0;j<beatStarts.length;j++){
    var pk = beatStarts[j] + beat.rOffset;
    if (pk > 0.05 && pk < STRIP_SEC - 0.02) peaks.push(pk);
  }
  for (var k=0;k<n;k++){
    var tt = k*dt, y = baseline ? baseline(tt) : 0;
    for (var m=0;m<beatStarts.length;m++){
      var rel = tt - beatStarts[m];
      if (rel >= 0 && rel <= beat.len) y += interp(beat.cp, rel);
    }
    samples[k] = y;
  }
  var fb = null;
  for (var q=0;q<beatStarts.length;q++){ if (beatStarts[q] > 0.3){ fb = beatStarts[q]; break; } }
  if (fb === null) fb = beatStarts[0];
  return {samples:samples, dt:dt, peaks:peaks, prSec:prSec, qrsSec:beat.qrsSec, firstBeat:fb};
}

/* ---------- rhythm library ---------- */
var RHYTHMS = {
  nsr:{name:"Normal sinus rhythm", reg:"regular", p:"yes", pr:"normal", qrs:"narrow",
    teach:"Everything checks out: rate 60 to 100, regular, a P before every QRS, normal PR, narrow QRS. This is the healthy baseline you compare everything else to."},
  brady:{name:"Sinus bradycardia", reg:"regular", p:"yes", pr:"normal", qrs:"narrow",
    teach:"Identical to normal sinus rhythm except the rate is below 60. Always ask: is the patient symptomatic? Athletes and sleeping patients can be bradycardic and fine."},
  tach:{name:"Sinus tachycardia", reg:"regular", p:"yes", pr:"normal", qrs:"narrow",
    teach:"Normal sinus features with a rate above 100. Usually a response to something: fever, pain, hypovolemia, anxiety. Treat the cause, not the rhythm."},
  avb1:{name:"1st-degree AV block", reg:"regular", p:"yes", pr:"long", qrs:"narrow",
    teach:"Looks like sinus rhythm, but the PR interval is stretched past 0.20 seconds. Every impulse still gets through; it just takes longer. Usually benign, but monitor."},
  afib:{name:"Atrial fibrillation", reg:"irregular", p:"no", pr:"na", qrs:"narrow",
    teach:"The two giveaways: an irregularly irregular rhythm and no true P waves, just a wavy fibrillating baseline. The atria are quivering, so there is no PR interval to measure."},
  vtach:{name:"Ventricular tachycardia", reg:"regular", p:"no", pr:"na", qrs:"wide",
    teach:"Fast, regular, wide bizarre QRS complexes with no P waves. The ventricles are driving the rhythm. This is a lethal rhythm: check the patient immediately. Pulse or no pulse changes everything."},
  asystole:{name:"Asystole", reg:null, p:null, pr:null, qrs:null,
    teach:"A nearly flat line: no electrical activity at all. Confirm in a second lead, check your patient and your leads, and if it is real, start CPR. Asystole is never shocked."}
};
var RHYTHM_KEYS = Object.keys(RHYTHMS);
var STEPS = ["rate","reg","p","pr","qrs","id"];
var STEP_LABEL = {rate:"1 · Rate", reg:"2 · Regular?", p:"3 · P waves", pr:"4 · PR interval", qrs:"5 · QRS width", id:"Name it!"};

/* ---------- state ---------- */
var S = {
  screen:"intro", round:0, rhythmKey:null, strip:null, stepIdx:0,
  marks:[], rateLocked:false, feedback:null, showCal:false,
  score:0, roundScore:0, roundMax:0, patients:0, missed:null,
  cal:{on:false, a:1.2, b:2.0}, zcal:{a:null, b:null}, _zoomT0:0
};

function step(){ return STEPS[S.stepIdx]; }
function rhythm(){ return S.rhythmKey ? RHYTHMS[S.rhythmKey] : null; }

function newRound(){
  var k;
  do { k = RHYTHM_KEYS[Math.floor(Math.random()*RHYTHM_KEYS.length)]; } while (k === S.rhythmKey);
  S.rhythmKey = k; S.strip = generateStrip(k);
  S.stepIdx = 0; S.marks = []; S.rateLocked = false; S.feedback = null;
  S.showCal = false; S.missed = null; S.roundScore = 0; S.roundMax = 0;
  S.cal.a = 1.2; S.cal.b = 2.0; S.zcal = {a:null, b:null};
  S.round++; S.screen = "play";
  render();
}
function award(ok){ S.roundMax += 10; if (ok){ S.score += 10; S.roundScore += 10; } }
function advance(){
  S.feedback = null; S.showCal = false;
  if (step() === "rate" && S.rhythmKey === "asystole"){ S.stepIdx = 5; render(); return; }
  if (S.stepIdx === 5){ S.patients++; S.screen = "summary"; render(); return; }
  S.stepIdx++; render();
}

/* ---------- interactions ---------- */
function handleTap(tSec){
  if (S.rateLocked || step() !== "rate") return;
  var tol = 26/PX_PER_SEC, nearest = -1, best = tol;
  for (var i=0;i<S.strip.peaks.length;i++){
    var d = Math.abs(S.strip.peaks[i]-tSec);
    if (d < best){ best = d; nearest = i; }
  }
  if (nearest === -1) return;
  var pt = S.strip.peaks[nearest];
  var idx = S.marks.indexOf(pt);
  if (idx >= 0) S.marks.splice(idx,1); else { S.marks.push(pt); S.marks.sort(function(a,b){return a-b;}); }
  render();
}
function lockRate(claimZero){
  S.rateLocked = true;
  var trueCount = S.strip.peaks.length;
  var found = claimZero ? 0 : S.marks.length;
  var ok = found === trueCount;
  if (!ok) S.missed = S.strip.peaks.filter(function(p){ return claimZero || S.marks.indexOf(p) < 0; });
  award(ok);
  var rate = trueCount*10, text;
  if (trueCount === 0){
    text = ok ? "Right: no R waves at all. A flat line means no rate to count. Check your patient and your leads!"
              : "Look again: there are no true QRS complexes here. This is a flat line.";
  } else {
    text = (ok ? "You found all " : "There are actually ") + trueCount +
      " R waves in this 6-second strip. " + trueCount + " \u00D7 10 = a rate of about " + rate + " bpm." +
      (rate < 60 ? " That is below 60: bradycardic territory." : rate > 100 ? " That is above 100: tachycardic territory." : " That lands in the normal 60 to 100 range.") +
      (ok ? "" : " The circled spikes are the ones missed.");
  }
  S.feedback = {ok:ok, text:text};
  render();
}
var LABELS = {
  reg:{regular:"Regular", irregular:"Irregular"},
  p:{yes:"Yes, one before every QRS", no:"No / can't find real P waves"},
  pr:{normal:"Normal (0.12\u20130.20 s)", long:"Prolonged (over 0.20 s)", na:"Can't measure it"},
  qrs:{narrow:"Narrow (under 0.12 s)", wide:"Wide (0.12 s or more)"}
};
function answer(stepKey, choice){
  if (S.feedback) return;
  var correct = rhythm()[stepKey];
  var ok = choice === correct;
  award(ok);
  var texts = {
    reg:{regular:"The R-to-R distances are consistent: you could march them out with calipers.",
         irregular:"The R-to-R distances keep changing with no pattern: irregularly irregular. That is a huge clue."},
    p:{yes:"There is one rounded P wave sitting in front of every QRS, so the sinus node is in charge.",
       no:(S.rhythmKey==="afib" ? "No true P waves, just a chaotic wavy baseline. The atria are fibrillating."
                                : "No P waves here: this rhythm starts in the ventricles, not the sinus node.")},
    pr:{normal:"The PR measures between 0.12 and 0.20 seconds: normal conduction time.",
        long:"The PR stretches past 0.20 seconds: the impulse is delayed at the AV node.",
        na:"With no P waves there is no PR interval to measure. Mark it as not measurable."},
    qrs:{narrow:"The QRS is under 0.12 seconds: the impulse used the normal fast pathways.",
         wide:"The QRS is 0.12 seconds or more, wide and bizarre: a ventricular origin."}
  };
  var explain = texts[stepKey][correct];
  S.feedback = {ok:ok, text: ok ? explain : ("The answer is \u201C" + LABELS[stepKey][correct] + "\u201D. " + explain)};
  render();
}
function answerId(choice){
  if (S.feedback) return;
  var ok = choice === S.rhythmKey;
  award(ok);
  S.feedback = {ok:ok, text:(ok ? "" : "This one is " + rhythm().name + ". ") + rhythm().teach};
  render();
}
function findingsData(){
  var rh = rhythm(), s = S.strip;
  if (S.rhythmKey === "asystole"){
    return [["Rate","0 bpm (flatline)"],["Regularity","n/a"],["P waves","n/a"],["PR interval","n/a"],["QRS width","n/a"]];
  }
  return [
    ["Rate","\u2248 " + (s.peaks.length*10) + " bpm"],
    ["Regularity", rh.reg === "regular" ? "Regular" : "Irregularly irregular"],
    ["P waves", rh.p === "yes" ? "Present before every QRS" : "Absent"],
    ["PR interval", s.prSec != null ? s.prSec.toFixed(2) + " s (" + (rh.pr === "long" ? "prolonged" : "normal") + ")" : "Not measurable"],
    ["QRS width", s.qrsSec.toFixed(2) + " s (" + (rh.qrs === "narrow" ? "narrow" : "wide") + ")"]
  ];
}

/* ---------- SVG builders ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function calText(a,b){
  return Math.abs(b-a).toFixed(2)+" s";
}
function caliperGroup(prefix, ax, bx, h){
  function leg(id,x){
    return '<line id="'+prefix+'-l'+id+'" x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="#215E9E" stroke-width="1.8" pointer-events="none"/>'
      + '<circle id="'+prefix+'-h'+id+'" cx="'+x+'" cy="12" r="8" fill="#2F7FD1" stroke="#fff" stroke-width="2" data-leg="'+id+'" style="cursor:ew-resize"/>'
      + '<circle id="'+prefix+'-g'+id+'" cx="'+x+'" cy="12" r="17" fill="transparent" data-leg="'+id+'"/>';
  }
  var lo = Math.min(ax,bx), w = Math.max(Math.abs(bx-ax),1);
  return '<g id="'+prefix+'-cal">'
    + '<line id="'+prefix+'-bar" x1="'+ax+'" y1="12" x2="'+bx+'" y2="12" stroke="#215E9E" stroke-width="2" pointer-events="none"/>'
    + '<rect id="'+prefix+'-barhit" x="'+lo+'" y="3" width="'+w+'" height="18" fill="transparent" data-leg="bar" style="cursor:grab"/>'
    + leg('a',ax) + leg('b',bx) + '</g>';
}
function gridSVG(w,h,sm){
  var out = "";
  for (var x=0;x<=w;x+=sm){
    var hv = Math.round(x/sm)%5===0;
    out += '<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="'+(hv?"#E9B3A6":"#F5D8D0")+'" stroke-width="'+(hv?1.1:0.6)+'"/>';
  }
  for (var y=0;y<=h;y+=sm){
    var hv2 = Math.round(y/sm)%5===0;
    out += '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="'+(hv2?"#E9B3A6":"#F5D8D0")+'" stroke-width="'+(hv2?1.1:0.6)+'"/>';
  }
  return out;
}
function tracePath(samples, dt, x0Sec, x1Sec, pxPerSec, baseY, mv){
  var d = "", i0 = Math.max(0, Math.floor(x0Sec/dt)), i1 = Math.min(samples.length-1, Math.ceil(x1Sec/dt));
  for (var i=i0;i<=i1;i++){
    var x = (i*dt - x0Sec)*pxPerSec, y = baseY - samples[i]*mv;
    d += (i===i0?"M":"L") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d;
}
function stripSVG(){
  var s = S.strip, out = "";
  out += gridSVG(STRIP_W, STRIP_H, PX_PER_SMALL);
  [0,3,6].forEach(function(sec){
    out += '<path d="M'+(sec*PX_PER_SEC - (sec===6?1:0))+' 2 l5 8 l-10 0 Z" fill="#5B7288"/>';
  });
  out += '<text x="'+(STRIP_W-6)+'" y="'+(STRIP_H-6)+'" text-anchor="end" font-size="9" fill="#5B7288">25 mm/s \u00B7 6 s strip</text>';
  if (S.showCal){
    for (var i=1;i<s.peaks.length;i++){
      var x0 = s.peaks[i-1]*PX_PER_SEC, x1 = s.peaks[i]*PX_PER_SEC;
      var rr = (s.peaks[i]-s.peaks[i-1]).toFixed(2);
      out += '<path d="M'+x0+' 24 Q'+((x0+x1)/2)+' 8 '+x1+' 24" stroke="#2F7FD1" stroke-width="1.6" fill="none"/>';
      out += '<text x="'+((x0+x1)/2)+'" y="20" text-anchor="middle" font-size="9.5" fill="#215E9E" font-weight="700">'+rr+'s</text>';
    }
  }
  out += '<path d="'+tracePath(s.samples, s.dt, 0, STRIP_SEC, PX_PER_SEC, BASE_Y, MV)+'" fill="none" stroke="#22303E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" pathLength="1" class="cb-draw"/>';
  if (step()==="rate"){
    for (var m=0;m<S.marks.length;m++){
      var mx = S.marks[m]*PX_PER_SEC, my = BASE_Y - MV*1.12 - 8;
      out += '<circle cx="'+mx+'" cy="'+my+'" r="6.5" fill="#2F7FD1" opacity="0.92"/>';
      out += '<text x="'+mx+'" y="'+(my+3.5)+'" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">'+(m+1)+'</text>';
    }
  }
  if (S.missed){
    for (var z=0;z<S.missed.length;z++){
      out += '<circle cx="'+(S.missed[z]*PX_PER_SEC)+'" cy="'+(BASE_Y - MV*1.12 - 8)+'" r="7" fill="none" stroke="#D95757" stroke-width="2.4" stroke-dasharray="3 2"/>';
    }
  }
  if (S.cal.on) out += caliperGroup('sc', S.cal.a*PX_PER_SEC, S.cal.b*PX_PER_SEC, STRIP_H);
  var sty = [];
  if (step()==="rate" && !S.rateLocked) sty.push("cursor:crosshair");
  if (S.cal.on) sty.push("touch-action:none");
  return '<svg id="strip-svg" class="strip" viewBox="0 0 '+STRIP_W+' '+STRIP_H+'" role="img" aria-label="6-second ECG rhythm strip"'
       + (sty.length ? ' style="'+sty.join(';')+'"' : '') + '>' + out + '</svg>';
}
function zoomSVG(mode){
  var s = S.strip;
  if (!s.peaks.length) return "";
  var zoom = 3, sm = PX_PER_SMALL*zoom, pxSec = PX_PER_SEC*zoom;
  var b = s.firstBeat, t0 = Math.max(0, b-0.06), span = 0.6;
  var w = span*pxSec, h = 210, baseY = 118;
  var out = gridSVG(w,h,sm);
  out += '<path d="'+tracePath(s.samples, s.dt, t0, t0+span, pxSec, baseY, 95)+'" fill="none" stroke="#22303E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  out += '<text x="8" y="16" font-size="11" fill="#5B7288">Zoomed \u00D73 \u00B7 measure with your calipers</text>';
  S._zoomT0 = t0;
  if (S.zcal.a === null){ S.zcal.a = t0 + 0.06; S.zcal.b = t0 + 0.16; }
  S.zcal.a = Math.max(t0, Math.min(t0+span, S.zcal.a));
  S.zcal.b = Math.max(t0, Math.min(t0+span, S.zcal.b));
  out += caliperGroup('zc', (S.zcal.a-t0)*pxSec, (S.zcal.b-t0)*pxSec, h);
  var readout = '<div class="calrow"><span class="calread" id="zc-read">'+calText(S.zcal.a, S.zcal.b)+'</span><span style="font-size:12px;color:var(--slate);font-weight:700">drag the caliper legs to measure</span></div>';
  return '<div class="zoomwrap"><svg id="zoom-svg" viewBox="0 0 '+w+' '+h+'" style="width:100%;min-width:320px;display:block;background:#FFF9F6;border-radius:12px;touch-action:none" role="img" aria-label="Zoomed view of one beat">'+out+'</svg></div>' + readout;
}
function pupSVG(size, mood){
  var mouth = mood==="sad" ? '<path d="M42 62 Q50 56 58 62" stroke="#17324A" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : mood==="wow" ? '<ellipse cx="50" cy="61" rx="5.5" ry="7" fill="#17324A"/>'
    : '<path d="M40 58 Q50 68 60 58" stroke="#17324A" stroke-width="3" fill="none" stroke-linecap="round"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100" aria-hidden="true">'
    + '<ellipse cx="22" cy="30" rx="13" ry="20" fill="#2F6FB5" transform="rotate(-18 22 30)"/>'
    + '<ellipse cx="78" cy="30" rx="13" ry="20" fill="#2F6FB5" transform="rotate(18 78 30)"/>'
    + '<ellipse cx="22" cy="32" rx="7" ry="12" fill="#1F4E85" transform="rotate(-18 22 32)"/>'
    + '<ellipse cx="78" cy="32" rx="7" ry="12" fill="#1F4E85" transform="rotate(18 78 32)"/>'
    + '<circle cx="50" cy="50" r="34" fill="#4D9DE0"/>'
    + '<ellipse cx="50" cy="58" rx="19" ry="15" fill="#EAF4FC"/>'
    + '<circle cx="38" cy="42" r="5.5" fill="#17324A"/><circle cx="62" cy="42" r="5.5" fill="#17324A"/>'
    + '<circle cx="39.8" cy="40.2" r="1.8" fill="#fff"/><circle cx="63.8" cy="40.2" r="1.8" fill="#fff"/>'
    + '<ellipse cx="50" cy="52" rx="6" ry="4.5" fill="#17324A"/>' + mouth
    + '<path d="M30 74 Q50 88 70 74" stroke="#17324A" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    + '<circle cx="70" cy="76" r="6" fill="#C9D6E2" stroke="#17324A" stroke-width="2.5"/>'
    + '</svg>';
}

/* ---------- rendering ---------- */
function blueyLine(){
  var st = step();
  if (st==="rate") return 'Fresh strip from telemetry! First, <b>rate</b>. This strip is exactly 6 seconds. Tap every tall spike (R wave) you can find, then we multiply by 10.';
  if (st==="reg") return 'Step 2: <b>regularity</b>. Are the R waves evenly spaced, like a steady drumbeat? Try my caliper button if you want help marching them out.';
  if (st==="p") return 'Step 3: <b>P waves</b>. Before each big spike, is there a small round bump? That bump means the atria fired first, like they should.';
  if (st==="pr") return 'Step 4: the <b>PR interval</b>: from the start of the P to the start of the QRS. I zoomed in on one beat. Measure it with your calipers! Normal is 0.12 to 0.20 seconds.';
  if (st==="qrs") return 'Last measurement: <b>QRS width</b>. Measure across the big spike with your calipers. Under 0.12 seconds is narrow and normal. 0.12 or more is wide, which means trouble below the AV node.';
  return 'Put it all together, nurse! Based on your five findings, what rhythm is this?';
}
function choiceBtn(action, dataAttrs, label, sub){
  return '<button class="choice" data-action="'+action+'" '+dataAttrs+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';
}
function render(){
  var app = document.getElementById("app"), html = "";
  if (S.screen === "intro"){
    html += '<div class="center"><div style="margin-top:20px">'+pupSVG(120,"happy")+'</div>'
      + '<h1>Code <span class="accent">Bluey</span></h1>'
      + '<p class="sub">Cardiac rhythm rounds with your favorite tele-unit pup</p>'
      + '<div class="card"><div style="font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:10px">Every strip, same 5 steps:</div>';
    var steps = [["Rate","count R waves in 6 seconds, then \u00D7 10"],["Regularity","are the R-to-R distances even?"],["P waves","one bump before every QRS?"],["PR interval","0.12\u20130.20 seconds is normal"],["QRS width","under 0.12 seconds is narrow"]];
    for (var i=0;i<steps.length;i++){
      html += '<div class="steplist"><span class="num">'+(i+1)+'</span><span style="font-size:15px"><b>'+steps[i][0]+'</b> \u2014 '+steps[i][1]+'</span></div>';
    }
    html += '<p class="fine">Practice strips are computer-generated approximations for learning the method; always confirm real rhythms per your program and unit policy.</p></div>'
      + '<button class="btn big" data-action="start">Start your shift \uD83E\uDE7A</button></div>';
    app.innerHTML = html; return;
  }
  if (S.screen === "summary"){
    var perfect = S.roundScore >= S.roundMax && S.roundMax > 0;
    var mood = perfect ? "happy" : (S.roundScore >= S.roundMax*0.5 ? "wow" : "sad");
    var headline = perfect ? "Perfect analysis!" : (S.roundScore >= S.roundMax*0.5 ? "Solid work, nurse!" : "Tough strip. Shake it off!");
    html += '<div class="center"><div style="margin-top:24px">'+pupSVG(110,mood)+'</div>'
      + '<h2 style="font-family:var(--disp);font-size:28px;margin:10px 0 4px">'+headline+'</h2>'
      + '<p style="color:var(--slate);font-weight:700;margin-top:0">That patient was in <b style="color:var(--blue-dark)">'+rhythm().name+'</b>.</p>'
      + '<div class="stats">'
      + '<div class="stat"><b>'+S.roundScore+'/'+S.roundMax+'</b><span>This round</span></div>'
      + '<div class="stat"><b>'+S.score+'</b><span>Total score</span></div>'
      + '<div class="stat"><b>'+S.patients+'</b><span>Patients seen</span></div>'
      + '</div><button class="btn" data-action="next-patient">Next patient \u2192</button></div>';
    app.innerHTML = html; return;
  }
  /* play screen */
  html += '<div class="hdr"><div class="brand">Code <span class="accent">Bluey</span> <span class="pt">\u00B7 Patient #'+S.round+'</span></div>'
    + '<div class="score">\u2605 '+S.score+'</div></div>';
  html += '<div class="stepchips">';
  for (var c=0;c<STEPS.length;c++){
    var cls = c===S.stepIdx ? "chip now" : (c<S.stepIdx ? "chip done" : "chip");
    html += '<div class="'+cls+'">'+STEP_LABEL[STEPS[c]]+'</div>';
  }
  html += '</div>';
  var mood2 = S.feedback ? (S.feedback.ok ? "happy" : "sad") : "happy";
  html += '<div class="speech"><div style="flex-shrink:0">'+pupSVG(64,mood2)+'</div><div class="bubble">'+blueyLine()+'</div></div>';
  html += '<div class="panel">' + stripSVG();
  html += '<div class="calrow"><button class="ghost" data-action="toggle-tool-cal">'+(S.cal.on ? 'Hide calipers' : '\uD83D\uDCCF Calipers')+'</button>'
        + (S.cal.on ? '<span class="calread" id="sc-read">'+calText(S.cal.a, S.cal.b)+'</span>' : '') + '</div>';
  if ((step()==="pr" || step()==="qrs") && S.strip.peaks.length) html += zoomSVG(step());
  html += '<div style="margin-top:12px">';
  if (!S.feedback){
    var st = step();
    if (st === "rate"){
      html += '<div class="count">R waves marked: <b>'+S.marks.length+'</b>'
        + (S.marks.length ? ' <span style="color:var(--slate)">\u2192 rate \u2248 '+(S.marks.length*10)+' bpm</span>' : '') + '</div>'
        + '<div class="rate-row"><button class="btn" data-action="lock-rate" '+(S.marks.length? '':'disabled')+'>Lock in '+(S.marks.length? S.marks.length*10+' bpm':'rate')+'</button>'
        + '<button class="ghost" data-action="flatline">I see no R waves (flatline)</button></div>';
    } else if (st === "reg"){
      html += '<button class="ghost" data-action="toggle-cal" style="margin-bottom:10px">'+(S.showCal?'Hide auto-march':'Auto-march R waves')+'</button>'
        + choiceBtn("answer",'data-step="reg" data-choice="regular"',"Regular","R-to-R spacing stays the same")
        + choiceBtn("answer",'data-step="reg" data-choice="irregular"',"Irregular","R-to-R spacing keeps changing");
    } else if (st === "p"){
      html += choiceBtn("answer",'data-step="p" data-choice="yes"',"Yes \u2014 one P before every QRS","")
        + choiceBtn("answer",'data-step="p" data-choice="no"',"No \u2014 absent, or just a wavy baseline","");
    } else if (st === "pr"){
      html += choiceBtn("answer",'data-step="pr" data-choice="normal"',"Normal: 0.12\u20130.20 seconds","")
        + choiceBtn("answer",'data-step="pr" data-choice="long"',"Prolonged: over 0.20 seconds","")
        + choiceBtn("answer",'data-step="pr" data-choice="na"',"Can't measure it","no P waves = no PR interval");
    } else if (st === "qrs"){
      html += choiceBtn("answer",'data-step="qrs" data-choice="narrow"',"Narrow: under 0.12 seconds","normal conduction")
        + choiceBtn("answer",'data-step="qrs" data-choice="wide"',"Wide: 0.12 seconds or more","ventricular origin");
    } else {
      var fd = findingsData();
      html += '<div class="findings"><div class="ftitle">Findings from your analysis</div>';
      for (var f=0;f<fd.length;f++){
        html += '<div class="frow"><span>'+fd[f][0]+'</span><b>'+fd[f][1]+'</b></div>';
      }
      html += '</div>';
      for (var r=0;r<RHYTHM_KEYS.length;r++){
        html += choiceBtn("answer-id",'data-key="'+RHYTHM_KEYS[r]+'"',RHYTHMS[RHYTHM_KEYS[r]].name,"");
      }
    }
  } else {
    var nextLabel = step()==="id" ? "See round summary \u2192"
      : (S.rhythmKey==="asystole" && step()==="rate" ? "Name this rhythm \u2192" : "Next step \u2192");
    html += '<div class="fb '+(S.feedback.ok?'ok':'bad')+'">'
      + '<div class="verdict">'+(S.feedback.ok?'Nice catch! +10 pts':'Not quite')+'</div>'
      + '<p>'+esc(S.feedback.text)+'</p>'
      + '<button class="btn" data-action="advance" style="margin-top:12px">'+nextLabel+'</button></div>';
  }
  html += '</div></div>';
  app.innerHTML = html;

  var svg = document.getElementById("strip-svg");
  if (svg && step()==="rate" && !S.rateLocked){
    svg.addEventListener("click", function(e){
      if (e.target.getAttribute && e.target.getAttribute("data-leg")) return;
      var rect = svg.getBoundingClientRect();
      var xView = ((e.clientX - rect.left)/rect.width)*STRIP_W;
      handleTap(xView/PX_PER_SEC);
    });
  }
  if (S.screen === "play"){
    if (S.cal.on){
      bindCaliper({svgId:"strip-svg", prefix:"sc", readId:"sc-read", state:S.cal,
                   t0:0, span:STRIP_SEC, viewW:STRIP_W, pxPerSec:PX_PER_SEC, snap:S.strip.peaks});
    }
    if (document.getElementById("zoom-svg")){
      bindCaliper({svgId:"zoom-svg", prefix:"zc", readId:"zc-read", state:S.zcal,
                   t0:S._zoomT0, span:0.6, viewW:0.6*PX_PER_SEC*3, pxPerSec:PX_PER_SEC*3, snap:null});
    }
  }
}

/* ---------- draggable calipers ---------- */
function bindCaliper(cfg){
  var svg = document.getElementById(cfg.svgId);
  if (!svg) return;
  var read = document.getElementById(cfg.readId);
  function xToSec(clientX){
    var r = svg.getBoundingClientRect();
    return cfg.t0 + (((clientX - r.left)/r.width)*cfg.viewW)/cfg.pxPerSec;
  }
  function clampT(t){ return Math.min(cfg.t0+cfg.span, Math.max(cfg.t0, t)); }
  function setAttr(id, attrs){
    var el = document.getElementById(cfg.prefix+id);
    if (!el) return;
    for (var k in attrs) el.setAttribute(k, attrs[k]);
  }
  function apply(){
    var st = cfg.state;
    var ax = (st.a-cfg.t0)*cfg.pxPerSec, bx = (st.b-cfg.t0)*cfg.pxPerSec;
    setAttr("-la",{x1:ax,x2:ax}); setAttr("-ha",{cx:ax}); setAttr("-ga",{cx:ax});
    setAttr("-lb",{x1:bx,x2:bx}); setAttr("-hb",{cx:bx}); setAttr("-gb",{cx:bx});
    setAttr("-bar",{x1:ax,x2:bx});
    setAttr("-barhit",{x:Math.min(ax,bx), width:Math.max(Math.abs(bx-ax),1)});
    if (read) read.textContent = calText(st.a, st.b);
  }
  var drag = null;
  svg.addEventListener("pointerdown", function(e){
    var leg = e.target.getAttribute ? e.target.getAttribute("data-leg") : null;
    if (!leg) return;
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch(err){}
    drag = {leg:leg, start:xToSec(e.clientX), a0:cfg.state.a, b0:cfg.state.b};
  });
  svg.addEventListener("pointermove", function(e){
    if (!drag) return;
    e.preventDefault();
    var st = cfg.state, t = xToSec(e.clientX);
    if (drag.leg === "bar"){
      var w = drag.b0 - drag.a0, na = drag.a0 + (t - drag.start);
      var lo = Math.min(na, na+w), hi = Math.max(na, na+w);
      if (lo < cfg.t0) na += cfg.t0 - lo;
      if (hi > cfg.t0+cfg.span) na -= hi - (cfg.t0+cfg.span);
      st.a = na; st.b = na + w;
    } else {
      var v = clampT(t);
      if (cfg.snap){
        for (var i=0;i<cfg.snap.length;i++){
          if (Math.abs(cfg.snap[i]-v) < 0.06){ v = cfg.snap[i]; break; }
        }
      }
      if (drag.leg === "a") st.a = v; else st.b = v;
    }
    apply();
  });
  function endDrag(){ drag = null; }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
}

/* ---------- event delegation ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-action]") : null;
  if (!el) return;
  var a = el.getAttribute("data-action");
  if (a==="start" || a==="next-patient") newRound();
  else if (a==="lock-rate") lockRate(false);
  else if (a==="flatline") lockRate(true);
  else if (a==="toggle-cal"){ S.showCal = !S.showCal; render(); }
  else if (a==="toggle-tool-cal"){ S.cal.on = !S.cal.on; render(); }
  else if (a==="answer") answer(el.getAttribute("data-step"), el.getAttribute("data-choice"));
  else if (a==="answer-id") answerId(el.getAttribute("data-key"));
  else if (a==="advance") advance();
});

render();
</script>
